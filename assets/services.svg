buteName="transform" type="translate" values="4 0;-2 0;4 0" dur="2.4s" repeatCount="indefinite"/></rect><rect x="1150" y="40" width="18" height="30" rx="5" fill="#FFD15C"><animateTransform attributeName="transform" type="translate" values="-4 0;2 0;-4 0" dur="2.4s" repeatCount="indefinite"/></rect><text x="844.0" y="112.0" font-size="25" font-weight="800" fill="#F5F2FF" textLength="151.1" lengthAdjust="spacingAndGlyphs">Flutter apps</text><text x="844.0" y="142.0" font-size="15" font-weight="500" fill="#F5F2FF" opacity=".62" textLength="290.1" lengthAdjust="spacingAndGlyphs">One codebase for Android and iOS when</text><text x="844.0" y="164.0" font-size="15" font-weight="500" fill="#F5F2FF" opacity=".62" textLength="177.4" lengthAdjust="spacingAndGlyphs">speed to market matters.</text><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.33;1" dur="0.90s" fill="freeze"/></g><g opacity="1"><rect x="0" y="220" width="384" height="196" rx="24" fill="#1B1540" stroke="#2E2763" stroke-width="1.5"/><text x="28.0" y="264.0" font-size="15" font-weight="500" fill="#FF6B4A" class="m" textLength="18.0" lengthAdjust="spacingAndGlyphs">04</text><circle cx="332" cy="272" r="32" fill="#FF6B4A" fill-opacity=".12"/><path d="M324 288 V260 M317 267 L324 260 L331 267" fill="none" stroke="#FF6B4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></path><path d="M340 256 V284 M333 277 L340 284 L347 277" fill="none" stroke="#FF6B4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></path><text x="28.0" y="332.0" font-size="25" font-weight="800" fill="#F5F2FF" textLength="230.3" lengthAdjust="spacingAndGlyphs">APIs &amp; networking</text><text x="28.0" y="362.0" font-size="15" font-weight="500" fill="#F5F2FF" opacity=".62" textLength="292.8" lengthAdjust="spacingAndGlyphs">Retrofit, coroutines and Paging 3 for fast,</text><text x="28.0" y="384.0" font-size="15" font-weight="500" fill="#F5F2FF" opacity=".62" textLength="208.6" lengthAdjust="spacingAndGlyphs">endless, offline-friendly data.</text><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.43;1" dur="1.05s" fill="freeze"/></g><g opacity="1"><rect x="408" y="220" width="384" height="196" rx="24" fill="#1B1540" stroke="#2E2763" stroke-width="1.5"/><text x="436.0" y="264.0" font-size="15" font-weight="500" fill="#3DF5A8" class="m" textLength="18.0" lengthAdjust="spacingAndGlyphs">05</text><circle cx="740" cy="272" r="32" fill="#3DF5A8" fill-opacity=".12"/><ellipse cx="740" cy="260" rx="16" ry="6" fill="#3DF5A8"/><path d="M724 260 v24 a16 6 0 0 0 32 0 v-24" fill="none" stroke="#3DF5A8" stroke-width="3"/><path d="M724 272 a16 6 0 0 0 32 0" fill="none" stroke="#3DF5A8" stroke-width="3"/><circle cx="758" cy="286" r="4" fill="#3DF5A8"><animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/></circle><text x="436.0" y="332.0" font-size="25" font-weight="800" fill="#F5F2FF" textLength="233.7" lengthAdjust="spacingAndGlyphs">Firebase &amp; storage</text><text x="436.0" y="362.0" font-size="15" font-weight="500" fill="#F5F2FF" opacity=".62" textLength="326.8" lengthAdjust="spacingAndGlyphs">Realtime Database, auth and local persistence</text><text x="436.0" y="384.0" font-size="15" font-weight="500" fill="#F5F2FF" opacity=".62" textLength="108.7" lengthAdjust="spacingAndGlyphs">with DataStore.</text><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.50;1" dur="1.20s" fill="freeze"/></g><g opacity="1"><rect x="816" y="220" width="384" height="196" rx="24" fill="#1B1540" stroke="#2E2763" stroke-width="1.5"/><text x="844.0" y="264.0" font-size="15" font-weight="500" fill="#A78BFA" class="m" textLength="18.0" lengthAdjust="spacingAndGlyphs">06</text><circle cx="1148" cy="272" r="32" fill="#A78BFA" fill-opacity=".12"/><circle cx="1148" cy="272" r="21" fill